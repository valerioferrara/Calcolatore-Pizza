<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Pizza">
<meta name="theme-color" content="#c2410c">
<style>
:root{--bg:#faf6ef;--card:#fff;--tx:#2b2118;--mu:#7a6a5b;--ac:#c2410c;--bd:#e6dccd;--ok:#2f7d32;--er:#b3261e;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1a1511;--card:#251e18;--tx:#f3eadf;--mu:#a8998a;--ac:#f08a4b;--bd:#3a3028;--ok:#7bd17f;--er:#ff8a80}}
:root[data-theme="dark"]{--bg:#1a1511;--card:#251e18;--tx:#f3eadf;--mu:#a8998a;--ac:#f08a4b;--bd:#3a3028;--ok:#7bd17f;--er:#ff8a80}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:760px;margin:0 auto;padding:16px}
h1{font-size:1.5rem;margin:.2em 0 .8em}
h2{font-size:1.05rem;margin:0 0 10px;color:var(--ac)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
label{display:flex;flex-direction:column;font-size:.8rem;color:var(--mu);gap:3px}
input,select{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:8px;width:100%;min-width:0}
.big input{font-size:1.6rem;font-weight:700;text-align:center}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse}
.fr{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding-bottom:12px;margin-bottom:12px;border-bottom:1px solid var(--bd)}
.fr .b{grid-column:1/-1;display:flex;align-items:flex-end;gap:10px}
.fr .gr{flex:1;text-align:right;font-weight:700;font-size:1.1rem;padding-bottom:8px}
th{font-size:.75rem;color:var(--mu);text-align:left;padding:4px}
td{padding:4px}
td.r{text-align:right;font-weight:700;white-space:nowrap}
button{font:inherit;border:0;border-radius:8px;padding:8px 12px;background:var(--ac);color:#fff;cursor:pointer}
button.g{background:transparent;color:var(--er);border:1px solid var(--bd);padding:6px 10px}
.res td{border-bottom:1px solid var(--bd);padding:8px 4px;vertical-align:top}
.res td:first-child{word-break:break-word}
body{overflow-x:hidden}
.mode{flex-wrap:wrap}
.tot td{border-bottom:0;font-size:1.05rem}
.msg{font-size:.85rem;margin-top:6px}
.ok{color:var(--ok)}.er{color:var(--er)}
.tl{list-style:none;margin:0;padding:0}
.tl li{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--bd)}
.tl li:last-child{border:0}
.tl small{color:var(--mu);display:block}
.tl b{color:var(--ac);text-align:right;white-space:nowrap}
.mode{display:flex;gap:8px;margin-bottom:10px}
.mode label{flex-direction:row;align-items:center;color:var(--tx);font-size:.9rem}
.mode input{width:auto}
</style>
</head>
<body>
<main>
<div id="errbox" style="display:none;background:#b3261e;color:#fff;padding:10px;border-radius:10px;margin-bottom:12px;font-size:.85rem"></div>
<h1>🍕 Calcolatrice Pizza</h1>

<section class="card big">
  <label>Quanti panetti vuoi fare?
    <input id="n" type="number" min="1" step="1" value="6" inputmode="numeric">
  </label>
  <button id="go" style="margin-top:10px;width:100%">Calcola</button>
</section>

<section class="card">
  <h2>Ricetta base</h2>
  <div class="grid">
    <label>Farina base (g)<input id="bf" type="number" value="1000" min="1"></label>
    <label>Panetti dalla base<input id="bn" type="number" value="6" min="1"></label>
    <label>Peso panetto (g)<input id="bp" type="number" value="270" min="1"></label>
    <label>Idratazione (% sulla farina)<input id="hy" type="number" value="68" step="0.5"></label>
    <label>Lievito fresco (g per base)<input id="ly" type="number" value="3" step="0.1"></label>
    <label>Sale (g per base)<input id="sa" type="number" value="25" step="0.5"></label>
    <label>Olio (g per base)<input id="ol" type="number" value="20" step="0.5"></label>
  </div>
</section>

<section class="card">
  <h2>Mix di farine (% sul totale farina)</h2>
  <div id="fl"></div>
  <div style="display:flex;gap:10px;align-items:center;margin-top:8px;flex-wrap:wrap">
    <button id="add">+ Aggiungi farina</button>
    <span id="pc" class="msg"></span>
  </div>
</section>

<section class="card">
  <h2>Ricetta per <span id="nl"></span> panetti</h2>
  <div class="scroll"><table class="res"><tbody id="out"></tbody></table></div>
  <div id="chk" class="msg"></div>
</section>

<section class="card">
  <h2>Tempi di lievitazione</h2>
  <div class="mode">
    <label><input type="radio" name="m" value="start" checked> Inserisco l’ora dell’impasto pronto</label>
    <label><input type="radio" name="m" value="end"> Inserisco l’ora di infornata</label>
  </div>
  <div class="grid">
    <label><span id="tl">Impasto pronto alle</span><input id="t0" type="datetime-local"></label>
    <label>Puntata TA (ore)<input id="d1" type="number" value="2" step="0.5" min="0"></label>
    <label>Frigo (ore)<input id="d2" type="number" value="12" step="0.5" min="0"></label>
    <label>Fuori frigo TA (ore)<input id="d3" type="number" value="1" step="0.5" min="0"></label>
    <label>Appretto TA (ore)<input id="d4" type="number" value="5" step="0.5" min="0"></label>
  </div>
  <ul class="tl" id="ph" style="margin-top:10px"></ul>
</section>
</main>

<script>
const $=id=>document.getElementById(id);
const KEY="pizza-v2";
let flours=[{n:"Manitoba",t:"Tipo 0",p:20},{n:"Nuvola",t:"Tipo 0",p:20},{n:"Farina pizzeria",t:"Tipo 0",p:60}];
const ids=["n","bf","bn","bp","hy","ly","sa","ol","d1","d2","d3","d4"];

function save(){try{const o={flours};ids.forEach(i=>o[i]=$(i).value);localStorage.setItem(KEY,JSON.stringify(o))}catch(e){}}
function load(){try{const o=JSON.parse(localStorage.getItem(KEY)||"null");if(!o)return;if(Array.isArray(o.flours)&&o.flours.length)flours=o.flours;ids.forEach(i=>{if(o[i]!==undefined)$(i).value=o[i]})}catch(e){}}

const num=v=>{const x=parseFloat(String(v).replace(",","."));return isFinite(x)?x:0};
const g=x=>(Math.round(x*10)/10).toLocaleString("it-IT",{maximumFractionDigits:1})+" g";
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function drawFlours(){
  $("fl").innerHTML=flours.map((f,i)=>`<div class="fr">
   <label>Nome<input data-i="${i}" data-k="n" value="${esc(f.n)}" placeholder="Nome"></label>
   <label>Tipologia<input data-i="${i}" data-k="t" value="${esc(f.t)}" placeholder="Tipo"></label>
   <div class="b"><label style="width:90px">%<input data-i="${i}" data-k="p" type="number" step="0.5" value="${f.p}"></label>
   <div class="gr" id="fg${i}"></div>
   <button class="g" data-del="${i}" aria-label="Rimuovi">✕</button></div></div>`).join("");
}

function calc(){
  const N=num($("n").value),bf=num($("bf").value),bn=num($("bn").value)||1,bp=num($("bp").value);
  const k=N/bn, flour=bf*k;
  $("nl").textContent=N;
  let sum=0;
  flours.forEach((f,i)=>{sum+=num(f.p);const c=$("fg"+i);if(c)c.textContent=g(flour*num(f.p)/100)});
  const pc=$("pc");
  pc.textContent="Totale: "+(Math.round(sum*10)/10)+"%";
  const okp=Math.abs(sum-100)<0.01;
  pc.className="msg "+(okp?"ok":"er");
  if(!okp)pc.textContent+=" — deve fare 100%";
  const water=flour*num($("hy").value)/100, yeast=num($("ly").value)*k, salt=num($("sa").value)*k, oil=num($("ol").value)*k;
  const tot=flour+water+yeast+salt+oil;
  let rows=flours.map(f=>`<tr><td>${esc(f.n||"Farina")} <small style="color:var(--mu)">${esc(f.t)} · ${num(f.p)}%</small></td><td class="r">${g(flour*num(f.p)/100)}</td></tr>`).join("");
  rows+=`<tr><td><b>Farina totale</b></td><td class="r">${g(flour)}</td></tr>
  <tr><td>Acqua (${num($("hy").value)}%)</td><td class="r">${g(water)}</td></tr>
  <tr><td>Lievito fresco</td><td class="r">${g(yeast)}</td></tr>
  <tr><td>Sale</td><td class="r">${g(salt)}</td></tr>
  <tr><td>Olio</td><td class="r">${g(oil)}</td></tr>
  <tr class="tot"><td><b>Impasto totale</b></td><td class="r">${g(tot)}</td></tr>`;
  $("out").innerHTML=rows;
  const per=N>0?tot/N:0;
  $("chk").innerHTML=`Peso reale per panetto con questi parametri: <b>${g(per)}</b> (obiettivo ${g(bp)})`;
}

function fmt(d){
  const t0=new Date();t0.setHours(0,0,0,0);
  const d0=new Date(d);d0.setHours(0,0,0,0);
  const diff=Math.round((d0-t0)/864e5);
  const lab=diff===0?"Oggi":diff===1?"Domani":diff===2?"Dopodomani":diff===-1?"Ieri":"";
  const dt=d.toLocaleDateString("it-IT",{weekday:"short",day:"numeric",month:"short"});
  const hm=d.toLocaleTimeString("it-IT",{hour:"2-digit",minute:"2-digit"});
  return `${hm}<small>${lab?lab+" · ":""}${dt}</small>`;
}

function timeline(){
  const mode=document.querySelector('input[name=m]:checked').value;
  $("tl").textContent=mode==="start"?"Impasto pronto alle":"Infornata alle";
  const v=$("t0").value; if(!v){$("ph").innerHTML="";return}
  const h=[num($("d1").value),num($("d2").value),num($("d3").value),num($("d4").value)];
  const total=h.reduce((a,b)=>a+b,0);
  let start=new Date(v);
  if(mode==="end")start=new Date(start.getTime()-total*36e5);
  const t=[start];
  h.forEach(x=>t.push(new Date(t[t.length-1].getTime()+x*36e5)));
  const steps=[
    ["Impasto pronto","Inizio puntata a temperatura ambiente"],
    ["In frigo",`Dopo ${h[0]} h di puntata`],
    ["Fuori dal frigo",`Dopo ${h[1]} h in frigo`],
    ["Staglio panetti",`Dopo ${h[2]} h a TA: formare i panetti`],
    ["Pronti per infornare",`Dopo ${h[3]} h di appretto`]];
  $("ph").innerHTML=steps.map((s,i)=>`<li><div><b style="color:var(--tx)">${s[0]}</b><small>${s[1]}</small></div><b>${fmt(t[i])}</b></li>`).join("")
   +`<li><div><b style="color:var(--tx)">Durata totale</b></div><b>${Math.round(total*10)/10} h</b></li>`;
}

function showErr(e){const b=document.getElementById("errbox");b.style.display="block";b.textContent="Errore: "+(e&&e.message?e.message:e)}
function all(){try{calc()}catch(e){showErr(e)}try{timeline()}catch(e){showErr(e)}try{save()}catch(e){}}
window.addEventListener("error",e=>showErr(e.message));

document.addEventListener("input",e=>{
  const el=e.target;
  if(el.dataset.i!==undefined){const f=flours[+el.dataset.i];f[el.dataset.k]=el.dataset.k==="p"?num(el.value):el.value}
  all();
});
document.addEventListener("change",e=>{if(e.target.name==="m")all()});
document.addEventListener("click",e=>{
  if(e.target.dataset.del!==undefined){flours.splice(+e.target.dataset.del,1);drawFlours();all()}
});
$("add").onclick=()=>{flours.push({n:"",t:"",p:0});drawFlours();all()};

$("go").onclick=()=>all();
window.addEventListener("pageshow",()=>all());
load();
const now=new Date();now.setMinutes(0,0,0);now.setHours(now.getHours()+1);
const pad=x=>String(x).padStart(2,"0");
$("t0").value=`${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())}T${pad(now.getHours())}:${pad(now.getMinutes())}`;
ids.forEach(i=>{});
drawFlours();all();
if("serviceWorker" in navigator){window.addEventListener("load",()=>{navigator.serviceWorker.register("sw.js").catch(()=>{})})}
</script>
</body>
</html>
